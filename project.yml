name: UnitPrice
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  knownRegions: [en, zh-Hans, zh-Hant]
settings:
  base:
    APP_ID: com.hgsldswk.unitprice
    APP_STORE_ID: ""
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  UnitPrice:
    type: application
    platform: iOS
    sources: [UnitPrice, Shared]
    dependencies:
      - target: UnitPriceWidget
        embed: true
    entitlements:
      path: UnitPrice/UnitPrice.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.unitprice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: UnitPrice AppStore
    info:
      path: UnitPrice/Info.plist
      properties:
        CFBundleDisplayName: Unit Price
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        APP_STORE_ID: $(APP_STORE_ID)
        CFBundleURLTypes:
          - CFBundleURLName: com.hgsldswk.unitprice
            CFBundleURLSchemes: [unitprice]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Unit Price List
            LSHandlerRank: Owner
            LSItemContentTypes: [com.hgsldswk.unitprice.list]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.hgsldswk.unitprice.list
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [unitpricelist]
  UnitPriceWidget:
    type: app-extension
    platform: iOS
    sources:
      - UnitPriceWidget
      - path: Shared
        includes: [Launch.swift, Entitlement.swift, L10n.swift, Comparison.swift, Records.swift, WidgetSnapshot.swift, Localizable.xcstrings]
    entitlements:
      path: UnitPriceWidget/UnitPriceWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.hgsldswk.unitprice]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).widget
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: UnitPrice Widget AppStore
    info:
      path: UnitPriceWidget/Info.plist
      properties:
        CFBundleDisplayName: Unit Price
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  UnitPriceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [UnitPriceTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).tests
        GENERATE_INFOPLIST_FILE: YES
  UnitPriceUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UnitPriceUITests]
    dependencies:
      - target: UnitPrice
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: UnitPrice
schemes:
  UnitPrice:
    build:
      targets:
        UnitPrice: all
        UnitPriceTests: [test]
    test:
      config: Debug
      targets: [UnitPriceTests]
  UnitPriceUI:
    build:
      targets:
        UnitPrice: all
        UnitPriceUITests: [test]
    test:
      config: Debug
      targets: [UnitPriceUITests]
